<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: #f0f4ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 40px;
  }
  .box {
    background: white;
    border-radius: 16px;
    padding: 32px 48px;
    box-shadow: 0 4px 24px rgba(0,0,0,.1);
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }
  .label { font-size: 12px; color: #999; }
  .sidebar-sim {
    background: white;
    border-radius: 12px;
    padding: 16px 20px;
    border: 1px solid #eee;
    width: 220px;
  }
</style>
</head>
<body>

  <div class="box">
    <div class="label">登录页 logo（大）</div>
    <!-- NEW LOGO SVG -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="280" height="79">
      <defs>
        <clipPath id="c1"><circle cx="46" cy="42" r="33"/></clipPath>
      </defs>
      <!-- Ring -->
      <circle cx="46" cy="42" r="33" fill="white" stroke="#1E40AF" stroke-width="8"/>
      <!-- 4 ascending bars -->
      <g clip-path="url(#c1)">
        <rect x="25" y="56" width="8" height="14" rx="1.5" fill="#007AFF"/>
        <rect x="36" y="47" width="8" height="23" rx="1.5" fill="#007AFF"/>
        <rect x="47" y="38" width="8" height="32" rx="1.5" fill="#007AFF"/>
        <rect x="58" y="29" width="8" height="41" rx="1.5" fill="#007AFF"/>
      </g>
      <!-- Handle -->
      <line x1="71" y1="68" x2="93" y2="90" stroke="#1E40AF" stroke-width="8" stroke-linecap="round"/>
      <!-- Wordmark -->
      <text x="108" y="57" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" fill="#1E40AF" letter-spacing="-1">Fintrack</text>
    </svg>
  </div>

  <div class="box">
    <div class="label">侧栏尺寸（小）</div>
    <div class="sidebar-sim">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="192" height="54">
        <defs>
          <clipPath id="c2"><circle cx="46" cy="42" r="33"/></clipPath>
        </defs>
        <circle cx="46" cy="42" r="33" fill="white" stroke="#1E40AF" stroke-width="8"/>
        <g clip-path="url(#c2)">
          <rect x="25" y="56" width="8" height="14" rx="1.5" fill="#007AFF"/>
          <rect x="36" y="47" width="8" height="23" rx="1.5" fill="#007AFF"/>
          <rect x="47" y="38" width="8" height="32" rx="1.5" fill="#007AFF"/>
          <rect x="58" y="29" width="8" height="41" rx="1.5" fill="#007AFF"/>
        </g>
        <line x1="71" y1="68" x2="93" y2="90" stroke="#1E40AF" stroke-width="8" stroke-linecap="round"/>
        <text x="108" y="57" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" fill="#1E40AF" letter-spacing="-1">Fintrack</text>
      </svg>
    </div>
  </div>

  <div class="box">
    <div class="label">登录卡片预览</div>
    <div style="background:#fff;border-radius:20px;padding:40px 40px 32px;width:360px;box-shadow:0 8px 32px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:0;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="230" height="65">
        <defs><clipPath id="c3"><circle cx="46" cy="42" r="33"/></clipPath></defs>
        <circle cx="46" cy="42" r="33" fill="white" stroke="#1E40AF" stroke-width="8"/>
        <g clip-path="url(#c3)">
          <rect x="25" y="56" width="8" height="14" rx="1.5" fill="#007AFF"/>
          <rect x="36" y="47" width="8" height="23" rx="1.5" fill="#007AFF"/>
          <rect x="47" y="38" width="8" height="32" rx="1.5" fill="#007AFF"/>
          <rect x="58" y="29" width="8" height="41" rx="1.5" fill="#007AFF"/>
        </g>
        <line x1="71" y1="68" x2="93" y2="90" stroke="#1E40AF" stroke-width="8" stroke-linecap="round"/>
        <text x="108" y="57" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" fill="#1E40AF" letter-spacing="-1">Fintrack</text>
      </svg>
      <p style="font-size:15px;color:#6E6E73;margin:8px 0 28px;font-weight:500;">金融产品销售管理系统</p>
      <div style="width:100%;margin-bottom:14px;">
        <div style="font-size:12px;color:#6E6E73;font-weight:600;margin-bottom:6px;">账号</div>
        <div style="height:44px;border:1.5px solid #E5E5EA;border-radius:11px;background:#fafafa;padding:0 14px;display:flex;align-items:center;font-size:14px;color:#aaa;">请输入账号</div>
      </div>
      <div style="width:100%;margin-bottom:18px;">
        <div style="font-size:12px;color:#6E6E73;font-weight:600;margin-bottom:6px;">密码</div>
        <div style="height:44px;border:1.5px solid #007AFF;border-radius:11px;background:#fff;box-shadow:0 0 0 3px rgba(0,122,255,.1);padding:0 14px;display:flex;align-items:center;font-size:14px;color:#aaa;">请输入密码</div>
      </div>
      <div style="width:100%;height:48px;background:#007AFF;border-radius:13px;display:flex;align-items:center;justify-content:center;color:white;font-size:15px;font-weight:600;letter-spacing:2px;">登 录</div>
    </div>
  </div>

</body>
</html>
