services:
  # 后端 API 服务
  - type: web
    name: fintrack-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        value: sqlite:////app/data/fintrack.db
    disk:
      name: fintrack-data
      mountPath: /app/data
      sizeGB: 1
    healthCheckPath: /health

  # 前端静态网站
  - type: web
    name: fintrack-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
