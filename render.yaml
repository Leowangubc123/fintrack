services:
  # 后端 API 服务 - 先部署这个
  - type: web
    name: fintrack-api
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_ORIGINS
        value: "*"
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1

  # 前端静态网站 - 后部署这个
  - type: web
    name: fintrack-web
    runtime: static
    buildCommand: |
      cd frontend && \
      echo "VITE_API_BASE_URL=https://fintrack-api.onrender.com" > .env.production && \
      npm install && \
      npm run build
    staticPublishPath: ./frontend/dist
