<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: #f0f4ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 40px;
    padding: 40px 0;
  }
  .box {
    background: white;
    border-radius: 16px;
    padding: 32px 48px;
    box-shadow: 0 4px 24px rgba(0,0,0,.1);
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }
  .label { font-size: 12px; color: #999; }
  .sidebar-sim {
    background: white;
    border-radius: 12px;
    padding: 16px 20px;
    border: 1px solid #eee;
    width: 220px;
  }
</style>
</head>
<body>

  <div class="box">
    <div class="label">登录页 logo（大）</div>
    <!-- NEW LOGO SVG v3: smaller lens, thicker ring, taller/thicker bars -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 80" width="250" height="74">
      <defs>
        <!-- Inner white ring clip - creates rounded corners on bars -->
        <clipPath id="innerLens">
          <circle cx="38" cy="40" r="22"/>
        </clipPath>
      </defs>

      <!-- Outer thick ring (magnifier frame) - smaller radius but thicker stroke -->
      <circle cx="38" cy="40" r="27" fill="white" stroke="#1E40AF" stroke-width="7"/>

      <!-- Inner thin white ring (lens edge) -->
      <circle cx="38" cy="40" r="22" fill="none" stroke="white" stroke-width="2"/>

      <!-- 3 taller & thicker bars, clipped by inner ring -->
      <g clip-path="url(#innerLens)">
        <!-- Bar 1 (short) - wider and taller -->
        <rect x="20" y="46" width="10" height="22" rx="0" fill="#007AFF"/>
        <!-- Bar 2 (medium) - wider and taller -->
        <rect x="33" y="36" width="10" height="32" rx="0" fill="#007AFF"/>
        <!-- Bar 3 (tall) - wider and taller -->
        <rect x="46" y="26" width="10" height="42" rx="0" fill="#007AFF"/>
      </g>

      <!-- Handle - adjusted for smaller lens -->
      <line x1="57" y1="63" x2="72" y2="80" stroke="#1E40AF" stroke-width="7" stroke-linecap="round"/>

      <!-- Wordmark -->
      <text x="84" y="54" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#1E40AF" letter-spacing="-1">Fintrack</text>
    </svg>
  </div>

  <div class="box">
    <div class="label">侧栏尺寸（小）</div>
    <div class="sidebar-sim">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 80" width="170" height="50">
        <defs>
          <clipPath id="innerLens2">
            <circle cx="38" cy="40" r="22"/>
          </clipPath>
        </defs>
        <circle cx="38" cy="40" r="27" fill="white" stroke="#1E40AF" stroke-width="7"/>
        <circle cx="38" cy="40" r="22" fill="none" stroke="white" stroke-width="2"/>
        <g clip-path="url(#innerLens2)">
          <rect x="20" y="46" width="10" height="22" fill="#007AFF"/>
          <rect x="33" y="36" width="10" height="32" fill="#007AFF"/>
          <rect x="46" y="26" width="10" height="42" fill="#007AFF"/>
        </g>
        <line x1="57" y1="63" x2="72" y2="80" stroke="#1E40AF" stroke-width="7" stroke-linecap="round"/>
        <text x="84" y="54" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#1E40AF" letter-spacing="-1">Fintrack</text>
      </svg>
    </div>
  </div>

  <div class="box">
    <div class="label">登录卡片预览</div>
    <div style="background:#fff;border-radius:20px;padding:40px 40px 32px;width:360px;box-shadow:0 8px 32px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:0;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 80" width="205" height="61">
        <defs>
          <clipPath id="innerLens3">
            <circle cx="38" cy="40" r="22"/>
          </clipPath>
        </defs>
        <circle cx="38" cy="40" r="27" fill="white" stroke="#1E40AF" stroke-width="7"/>
        <circle cx="38" cy="40" r="22" fill="none" stroke="white" stroke-width="2"/>
        <g clip-path="url(#innerLens3)">
          <rect x="20" y="46" width="10" height="22" fill="#007AFF"/>
          <rect x="33" y="36" width="10" height="32" fill="#007AFF"/>
          <rect x="46" y="26" width="10" height="42" fill="#007AFF"/>
        </g>
        <line x1="57" y1="63" x2="72" y2="80" stroke="#1E40AF" stroke-width="7" stroke-linecap="round"/>
        <text x="84" y="54" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#1E40AF" letter-spacing="-1">Fintrack</text>
      </svg>
      <p style="font-size:15px;color:#6E6E73;margin:8px 0 28px;font-weight:500;">金融产品销售管理系统</p>
      <div style="width:100%;margin-bottom:14px;">
        <div style="font-size:12px;color:#6E6E73;font-weight:600;margin-bottom:6px;">账号</div>
        <div style="height:44px;border:1.5px solid #E5E5EA;border-radius:11px;background:#fafafa;padding:0 14px;display:flex;align-items:center;font-size:14px;color:#aaa;">请输入账号</div>
      </div>
      <div style="width:100%;margin-bottom:18px;">
        <div style="font-size:12px;color:#6E6E73;font-weight:600;margin-bottom:6px;">密码</div>
        <div style="height:44px;border:1.5px solid #007AFF;border-radius:11px;background:#fff;box-shadow:0 0 0 3px rgba(0,122,255,.1);padding:0 14px;display:flex;align-items:center;font-size:14px;color:#aaa;">请输入密码</div>
      </div>
      <div style="width:100%;height:48px;background:#007AFF;border-radius:13px;display:flex;align-items:center;justify-content:center;color:white;font-size:15px;font-weight:600;letter-spacing:2px;">登 录</div>
    </div>
  </div>

</body>
</html>
