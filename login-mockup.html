<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Mockup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #EBF4FF 0%, #F0F4FF 50%, #EEF2FF 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: #ffffff;
    border-radius: 24px;
    padding: 52px 44px 44px;
    width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,.10), 0 4px 16px rgba(0,0,0,.06);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .login-logo {
    width: 240px;
    margin-bottom: 12px;
  }
  .login-logo img {
    width: 100%;
    height: auto;
    display: block;
  }
  .login-subtitle {
    font-size: 16px;
    color: #6E6E73;
    margin: 0 0 36px 0;
    font-weight: 500;
    letter-spacing: .5px;
  }
  .form-group {
    width: 100%;
    margin-bottom: 18px;
  }
  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #6E6E73;
    margin-bottom: 7px;
  }
  .form-input {
    width: 100%;
    height: 46px;
    border: 1.5px solid #E5E5EA;
    border-radius: 12px;
    padding: 0 16px;
    font-size: 15px;
    color: #1D1D1F;
    background: #FAFAFA;
    outline: none;
  }
  .form-input.focused {
    border-color: #007AFF;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(0,122,255,.12);
  }
  .login-btn {
    width: 100%;
    height: 50px;
    background: #007AFF;
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    letter-spacing: 2px;
  }
  .login-btn:hover { background: #0066D6; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" style="width:100%;height:auto;display:block;">
        <defs>
          <clipPath id="lensClipLogin">
            <circle cx="62" cy="58" r="34"/>
          </clipPath>
        </defs>
        <circle cx="62" cy="58" r="34" fill="#ffffff" stroke="#1E40AF" stroke-width="7"/>
        <g clip-path="url(#lensClipLogin)">
          <rect x="38" y="58" width="10" height="20" rx="1.5" fill="#007AFF"/>
          <rect x="53" y="46" width="10" height="32" rx="1.5" fill="#007AFF"/>
          <rect x="68" y="36" width="10" height="42" rx="1.5" fill="#007AFF"/>
        </g>
        <line x1="88" y1="85" x2="112" y2="110" stroke="#1E40AF" stroke-width="7" stroke-linecap="round"/>
        <text x="130" y="74" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#1E40AF" letter-spacing="-1">Fintrack</text>
      </svg>
    </div>
    <p class="login-subtitle">金融产品销售管理系统</p>
    <div class="form-group">
      <label class="form-label">账号</label>
      <input class="form-input" type="text" value="admin" />
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input class="form-input focused" type="password" value="••••••••••••" />
    </div>
    <button class="login-btn">登 录</button>
  </div>
</body>
</html>
